    zone_type: uplink
    port_spec: 33-64
    breakout_option: b_1x800
    allocation_strategy: sequential
    priority: 20
  - switch_class: be-plane-a-leaf
    zone_name: be-plane-a-server-ports
    transceiver_module_type: xcvr_generic_200g
    zone_type: server
    port_spec: 1-32
    breakout_option: b_2x400
    allocation_strategy: sequential
    priority: 10
  - switch_class: be-plane-a-leaf
    zone_name: be-plane-a-uplinks
    transceiver_module_type: xcvr_generic_200g
    zone_type: uplink
    port_spec: 33-64
    breakout_option: b_1x800
    allocation_strategy: sequential
    priority: 20
  - switch_class: be-plane-b-leaf
    zone_name: be-plane-b-server-ports
    transceiver_module_type: xcvr_generic_200g
    zone_type: server
    port_spec: 1-32
    breakout_option: b_2x400
    allocation_strategy: sequential
    priority: 10
  - switch_class: be-plane-b-leaf
