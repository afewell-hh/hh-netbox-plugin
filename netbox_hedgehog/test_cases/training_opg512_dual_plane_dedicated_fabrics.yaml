plan:
  name: Training OPG-512 Dual Plane Dedicated Fabrics
  status: draft
  description: >
    OPG-512 dual-plane training architecture. Two independent backend fabrics
    carry CX8 2x400G per GPU. Dedicated frontend and storage fabrics each carry
    two BF3 400G links per server. Converged management carries one BMC and two
    Intel X550 10GBASE-T links per server via SFP+ copper adapters on DS2000 leaves.
    All uplinks are reserved for a future XOC; this OPG contains no spine switches.

switch_classes:
  - switch_class_id: fe-leaf
    fabric_name: frontend
    fabric_class: managed
    hedgehog_role: server-leaf
    device_type_extension: ds5000_ext
    mclag_pair: false
    uplink_ports_per_switch: 32
  - switch_class_id: be-plane-a-leaf
    fabric_name: backend-plane-a
    fabric_class: managed
    hedgehog_role: server-leaf
    device_type_extension: ds5000_ext
    mclag_pair: false
  - switch_class_id: be-plane-b-leaf
    fabric_name: backend-plane-b
    fabric_class: managed
    hedgehog_role: server-leaf
    device_type_extension: ds5000_ext
    mclag_pair: false
  - switch_class_id: storage-leaf
    fabric_name: storage
    fabric_class: managed
    hedgehog_role: server-leaf
    device_type_extension: ds5000_ext
    uplink_ports_per_switch: 32
    mclag_pair: false
  - switch_class_id: conv-mgmt-leaf
    fabric_name: conv-mgmt
    fabric_class: managed
    hedgehog_role: server-leaf
    device_type_extension: ds2000_ext
    uplink_ports_per_switch: 4
    mclag_pair: false

switch_port_zones:
  - switch_class: fe-leaf
    zone_name: fe-server-ports
    transceiver_module_type: xcvr_generic_400g
    zone_type: server
    port_spec: 1-32
    breakout_option: b_2x400
    allocation_strategy: sequential
    priority: 10
  - switch_class: fe-leaf
    zone_name: fe-uplinks
