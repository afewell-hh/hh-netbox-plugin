    allocation_strategy: sequential
    priority: 20
  - switch_class: storage-leaf
    zone_name: storage-server-ports
    transceiver_module_type: xcvr_generic_400g
    zone_type: server
    port_spec: 1-32
    breakout_option: b_2x400
    allocation_strategy: sequential
