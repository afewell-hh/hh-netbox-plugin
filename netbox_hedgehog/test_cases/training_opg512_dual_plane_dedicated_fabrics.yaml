    module_type: nic_cx8_dual_400

server_connections:
  - server_class: compute
    connection_id: fe-bf3-0
    transceiver_module_type: xcvr_generic_400g
    connection_name: frontend
    nic: fe-bf3-0
    port_index: 0
    ports_per_connection: 1
    hedgehog_conn_type: unbundled
    # rail-optimized rail 0/1 deterministically spreads each server's two BF3
    # frontend links across the two fe-leaves (alternating cannot: single-port
    # connections have port_index==0, so alternating always picks fe-leaf-1).
    distribution: rail-optimized
    target_zone: fe-leaf/fe-server-ports
    speed: 400
    rail: 0
    port_type: data
  - server_class: compute
    connection_id: fe-bf3-1
    transceiver_module_type: xcvr_generic_400g
    connection_name: frontend
    nic: fe-bf3-1
    port_index: 0
    ports_per_connection: 1
    hedgehog_conn_type: unbundled
    distribution: rail-optimized
    target_zone: fe-leaf/fe-server-ports
    speed: 400
    rail: 1
    port_type: data
  - server_class: compute
    connection_id: storage-bf3-0
    transceiver_module_type: xcvr_generic_400g
    connection_name: storage
    nic: storage-bf3-0
    port_index: 0
    ports_per_connection: 1
    hedgehog_conn_type: unbundled
    # rail-optimized rail 0/1: spread each server's two BF3 storage links across
    # the two storage-leaves (same reason as frontend above).
    distribution: rail-optimized
    target_zone: storage-leaf/storage-server-ports
    speed: 400
    rail: 0
    port_type: data
  - server_class: compute
    connection_id: storage-bf3-1
    transceiver_module_type: xcvr_generic_400g
    connection_name: storage
    nic: storage-bf3-1
    port_index: 0
    ports_per_connection: 1
    hedgehog_conn_type: unbundled
    distribution: rail-optimized
    target_zone: storage-leaf/storage-server-ports
    speed: 400
    rail: 1
    port_type: data
  - server_class: compute
    connection_id: bmc-mgmt
    transceiver_module_type: xcvr_sfp_plus_10gbase_t
    connection_name: bmc-management
    nic: bmc
    port_index: 0
    ports_per_connection: 1
    hedgehog_conn_type: unbundled
    distribution: same-switch
    target_zone: conv-mgmt-leaf/conv-mgmt-server-ports
    speed: 10
    port_type: data
  - server_class: compute
    connection_id: x550-mgmt
    transceiver_module_type: xcvr_sfp_plus_10gbase_t
    connection_name: x550-management
    nic: x550
    port_index: 0
    ports_per_connection: 2
    hedgehog_conn_type: unbundled
    # same-switch (matches bmc-mgmt): keep a server's 3 management links (BMC +
    # both X550 ports) on one conv-mgmt leaf. same-switch spreads the 64 servers
    # evenly across the 4 leaves (16 servers -> 48 links per leaf = exact fit).
    # alternating would use only 2 of the 4 leaves and overload them.
    distribution: same-switch
    target_zone: conv-mgmt-leaf/conv-mgmt-server-ports
    speed: 10
    port_type: data
  # Plane A: port0 of each CX8 GPU NIC → backend-plane-a
  - server_class: compute
    connection_id: be-gpu0-plane-a
    transceiver_module_type: xcvr_generic_200g
    connection_name: backend-gpu0-plane-a
