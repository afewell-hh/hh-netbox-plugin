    transceiver_module_type: xcvr_celestica_100g_sr4
    zone_type: uplink
    port_spec: 49-52
    breakout_option: b_1x100
    allocation_strategy: sequential
    priority: 20

server_classes:
  - server_class_id: compute
    description: 64 training compute servers, 8 xPUs each, with dedicated frontend, storage, and converged management fabrics
    category: gpu
    quantity: 64
    gpus_per_server: 8
    server_device_type: gpu_server_dual_plane

server_nics:
